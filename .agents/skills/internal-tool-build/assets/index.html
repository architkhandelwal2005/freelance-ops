<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nila sample tracker</title><style>body{font:17px system-ui;max-width:760px;margin:auto;padding:20px}input,button{font:inherit;padding:8px;margin:4px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #aaa;text-align:left;padding:8px}@media(max-width:500px){table{font-size:14px}}</style><h1>Nila sample requests</h1><p>Fictional local-only data. Do not enter client information.</p><form id="f"><label>Item <input id="item" required maxlength="60"></label><label>Status <select id="status"><option>New</option><option>Done</option></select></label><button>Add</button></form><label>Search <input id="search"></label><table><thead><tr><th>Item</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><script>const form=document.getElementById('f'), item=document.getElementById('item'), statusField=document.getElementById('status'), search=document.getElementById('search'), rows=document.getElementById('rows');const key='nila-sample-v1';let data=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){rows.replaceChildren();data.filter(x=>x.item.toLowerCase().includes(search.value.toLowerCase())).forEach(x=>{let tr=document.createElement('tr');let a=document.createElement('td');a.textContent=x.item;let b=document.createElement('td');b.textContent=x.status;let c=document.createElement('td');let btn=document.createElement('button');btn.textContent='Toggle';btn.onclick=()=>{x.status=x.status==='New'?'Done':'New';save()};c.append(btn);tr.append(a,b,c);rows.append(tr)})}form.onsubmit=e=>{e.preventDefault();data.push({item:item.value.trim(),status:statusField.value});item.value='';save()};search.oninput=render;render()</script></html>

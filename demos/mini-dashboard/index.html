<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nila Studio | Request dashboard demo</title><style>:root{font:17px/1.5 system-ui;color:#193a32;background:#f5f4ef}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:28px}h1{font-size:clamp(2rem,5vw,3.2rem)}.panel{background:white;border:1px solid #d6e0d6;border-radius:12px;padding:24px;margin:20px 0}.form-grid,.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:block;font-weight:700;font-size:.88rem}input,select,button{font:inherit;padding:10px;border-radius:5px;border:1px solid #a5b7a8;width:100%}button{background:#193a32;color:white;cursor:pointer;border:0}.secondary{background:#e4eee6;color:#193a32}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d29f64}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #d9e1d8}td button{width:auto;margin-right:6px}small{color:#617266}.scroll{overflow-x:auto}#status{min-height:24px}@media(max-width:700px){.form-grid,.filters{grid-template-columns:1fr}table{min-width:640px}}</style><header><p>Fictional local dashboard</p><h1>Keep requests in view.</h1><p>Search, filter, add and edit imaginary Nila Studio requests. Records stay in this browser only; do not enter client data.</p></header><main><section class="panel"><h2 id="form-title">Add request</h2><form id="form"><div class="form-grid"><label>Request name<input id="name" required maxlength="80"></label><label>Category<select id="category"><option>Design</option><option>Content</option><option>Other</option></select></label><label>Status<select id="state"><option>New</option><option>In progress</option><option>Done</option></select></label></div><button id="save" style="margin-top:16px">Add request</button><button type="button" class="secondary" id="cancel" hidden>Cancel edit</button></form><p id="status" role="status"></p></section><section class="panel"><div class="filters"><label>Search<input id="search" placeholder="Search request name"></label><label>Filter status<select id="filter"><option value="">All</option><option>New</option><option>In progress</option><option>Done</option></select></label><label>Rows shown<strong id="count" style="display:block;font-size:1.7rem">0</strong></label></div><div class="scroll"><table><thead><tr><th>Request</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><small>Records are stored in localStorage and can be cleared in your browser settings.</small></section></main><script>const $=id=>document.getElementById(id),key='nila-dashboard-demo-v1';let data=JSON.parse(localStorage.getItem(key)||'[]'),editing=null;if(!data.length){data=[{id:'a',name:'Desk tray concept',category:'Design',state:'New'},{id:'b',name:'FAQ copy',category:'Content',state:'Done'}];localStorage.setItem(key,JSON.stringify(data))}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){const q=$('search').value.trim().toLowerCase(),status=$('filter').value;const visible=data.filter(x=>x.name.toLowerCase().includes(q)&&(!status||x.state===status));$('rows').replaceChildren();$('count').textContent=visible.length;for(const row of visible){let tr=document.createElement('tr');for(const value of [row.name,row.category,row.state]){let td=document.createElement('td');td.textContent=value;tr.append(td)}let td=document.createElement('td'),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='Edit';del.textContent='Delete';del.className='secondary';edit.onclick=()=>{editing=row.id;$('name').value=row.name;$('category').value=row.category;$('state').value=row.state;$('form-title').textContent='Edit request';$('save').textContent='Save changes';$('cancel').hidden=false;$('name').focus()};del.onclick=()=>{if(confirm('Delete this fictional request?')){data=data.filter(x=>x.id!==row.id);save()}};td.append(edit,del);tr.append(td);$('rows').append(tr)}}$('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim();if(!name)return;let record={id:editing||crypto.randomUUID(),name,category:$('category').value,state:$('state').value};if(editing)data=data.map(x=>x.id===editing?record:x);else data.push(record);$('status').textContent=editing?'Request updated.':'Request added.';editing=null;$('form').reset();$('form-title').textContent='Add request';$('save').textContent='Add request';$('cancel').hidden=true;save()};$('cancel').onclick=()=>{editing=null;$('form').reset();$('form-title').textContent='Add request';$('save').textContent='Add request';$('cancel').hidden=true};$('search').oninput=render;$('filter').onchange=render;render();</script></html>

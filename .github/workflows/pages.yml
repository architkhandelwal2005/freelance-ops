name: Publish portfolio

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'demos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble portfolio and demos
        run: |
          mkdir -p public/demos
          cp -R portfolio/. public/
          cp -R demos/. public/demos/
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
